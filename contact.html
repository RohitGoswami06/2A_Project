<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Riccardo Eyewear</title>
    <meta name="description" content="Get in touch with Riccardo Eyewear. Contact us for inquiries, support, or feedback about our premium eyewear collection.">
    <meta name="keywords" content="contact Riccardo Eyewear, eyewear support, customer service">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.riccardoeyewear.com/contact.html">
    <!-- OpenGraph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Contact Us - Riccardo Eyewear">
    <meta property="og:description" content="Get in touch with Riccardo Eyewear. Contact us for inquiries, support, or feedback about our premium eyewear collection.">
    <meta property="og:url" content="https://www.riccardoeyewear.com/contact.html">
    <meta property="og:image" content="https://www.riccardoeyewear.com/assets/website_logo.png">
    <meta property="og:site_name" content="Riccardo Eyewear">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Contact Us - Riccardo Eyewear">
    <meta name="twitter:description" content="Get in touch with Riccardo Eyewear. Contact us for inquiries, support, or feedback about our premium eyewear collection.">
    <meta name="twitter:image" content="https://www.riccardoeyewear.com/assets/website_logo.png">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Montserrat:wght@400;500;600;700&family=Yeseva+One&display=swap"
        rel="stylesheet">

    <!-- CSS Links -->
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="footer.css">
    <link rel="stylesheet" href="about.css">
    <link rel="stylesheet" href="contact.css">
</head>

<body>

    <!-- HEADER NAVBAR -->
    <header class="border-bottom " id="main_div">
        <div class="container-fluid">
            <div id="header-nav"></div>
        </div>

        <h1 class="text-dark text-center fw-normal">Contact</h1>
    </header>

    <!-- SLIDE-OUT CART PANEL DRAWER -->
    <div class="cart-overlay" id="cartOverlay" onclick="closeCartPanel()"></div>
    <div class="cart-panel bg-white d-flex flex-column" id="cartPanel">
        <div class="d-flex justify-content-between align-items-center px-4 py-3 border-bottom">
            <h6 class="mb-0 fw-bold text-uppercase">Shopping Cart</h6>
            <button class="btn btn-link text-dark p-0 fs-5 text-decoration-none"
                onclick="closeCartPanel()">&#x2715;</button>
        </div>
        <div class="flex-grow-1 overflow-auto px-4 py-3" id="cartPanelItems"></div>
        <div class="border-top px-4 py-3">
            <div class="d-flex justify-content-between fw-semibold mb-3 pb-3 border-bottom">
                <span>Subtotal:</span>
                <span id="cartPanelSubtotal">$0.00</span>
            </div>
            <button class="btn btn-outline-dark w-100 fw-bold text-uppercase mb-2 cart-btn"
                onclick="window.location.href='cart.html'">VIEW CART</button>
            <button class="btn btn-outline-dark w-100 fw-bold text-uppercase cart-btn"
                onclick="window.location.href='checkout.html'">CHECKOUT</button>
        </div>
    </div>

    <!-- MAIN CONTACT CONTENT SECTION -->
    <main>
        <section class="contact-section py-5 overflow-hidden">
            <div class="container-fluid">
                <div class="row align-items-center">

                    <!-- LEFT SIDE -->
                    <div class="col-12 col-lg-6 col-xl-04">

                        <h2 class="contact-title fw-bold mb-4">
                            Get in touch
                        </h2>

                        <p class="contact-description text-secondary mb-4 pe-5">
                            Lorem ipsum dolor sit amet, consectetur adipiscing elit.
                            Ut id leo tempor, congue justo at, lobortis orci.
                        </p>

                        <div class="d-flex flex-column gap-4">

                            <div class="d-flex align-items-center gap-2">
                                <i class="bi bi-geo-alt-fill"></i>
                                <a href="#" class="text-dark fs-6">
                                    123 Fifth Avenue, New York, NY 10160
                                </a>
                            </div>

                            <div class="d-flex align-items-center gap-2">
                                <i class="bi bi-envelope-fill"></i>
                                <a href="mailto:contact@info.com" class="text-dark fs-6">
                                    contact@info.com
                                </a>
                            </div>

                            <div class="d-flex align-items-center gap-2">
                                <i class="bi bi-telephone-fill"></i>
                                <span class="fs-6">9-334-7565-9787</span>
                            </div>

                        </div>

                    </div>


                    <!-- RIGHT SIDE -->
                    <div class="col-12 col-lg-6 col-xl-08">

                        <div class="contact-form-box">

                            <form>

                                <div class="row g-4">

                                    <!-- FIRST NAME -->
                                    <div class="col-12 col-md-6">
                                        <label class="form-label">
                                            First Name <span>*</span>
                                        </label>

                                        <input type="text" class="form-control">
                                    </div>

                                    <!-- LAST NAME -->
                                    <div class="col-12 col-md-6">
                                        <label class="form-label">
                                            Last Name <span>*</span>
                                        </label>

                                        <input type="text" class="form-control">
                                    </div>

                                    <!-- EMAIL -->
                                    <div class="col-12">
                                        <label class="form-label">
                                            Email <span>*</span>
                                        </label>

                                        <input type="email" class="form-control">
                                    </div>

                                    <!-- MESSAGE -->
                                    <div class="col-12">
                                        <label class="form-label">
                                            Message
                                        </label>

                                        <textarea class="form-control"></textarea>
                                    </div>

                                    <!-- BUTTON -->
                                    <div class="col-12">
                                        <button type="submit" class="btn btn-dark px-3 py-2">
                                            SEND
                                        </button>
                                    </div>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>
            </div>
        </section>
    </main>
    <!-- FOOTER NAVBAR -->
    <div id="footer-nav"></div>

    <!-- JavaScript Files -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="header.js"></script>
    <script src="footer.js"></script>

</body>

</html>
