<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Riccardo Eyewear</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        .nav-linkk {
            color: #555;
            font-family: "Montserrat", sans-serif;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            line-height: 65px;
        }


        /* MOBILE TOGGLE */

        .mobile-toggle {
            border: 1px solid #aaa;
            background: transparent;
            width: 28px;
            height: 28px;
            padding: 0;
        }

        .mobile-toggle i {
            font-size: 14px;
        }
        /* MOBILE DROPDOWN */
        .mobile-menu {
            width: 100%;
        }
        .font-custom {
            font-family: "Montserrat", sans-serif;
        }
        .fs-custom {
            font-size: 14px;
        }

    </style>

</head>


<body>

    <header>

        <div class="container-fluid">

            <div class="row align-items-center">


                <!-- ================= COLUMN 1 : NAVBAR ================= -->

                <div class="col-xl-4 ps-xl-3 col-xxl-5 col-md-4 d-none d-lg-block me-5">

                    <nav class="navbar">

                        <div>

                            <ul class="navbar-nav flex-row flex-wrap " style=" padding-left: 20px;">

                                <li class="nav-item me-2 mb-3">
                                    <a class="nav-linkk ps-lg-3 pe-lg-2" href="#home">
                                        Home
                                    </a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-linkk ps-lg-3 pe-lg-3" href="#services">
                                        Women
                                    </a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-linkk ps-lg-3 pe-lg-3" href="#about">
                                        Men
                                    </a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-linkk ps-lg-3 pe-lg-2" href="#contact">
                                        About Us
                                    </a>
                                </li>

                                <li class="nav-item">
                                    <a class="nav-linkk px-lg-3 me-lg-4" href="#">
                                        Contact
                                    </a>
                                </li>

                            </ul>

                        </div>

                    </nav>

                </div>


                <!-- ================= COLUMN 2 : LOGO ================= -->

                <div class="col-lg-2 col-12 text-center ms-5">

                    <img src="assets/website_logo.png"
                        alt="Logo"
                        class="h-50 w-75">


                    <!-- MOBILE TOGGLE + DROPDOWN -->

                    <div class="dropdown d-lg-none mt-2">

                        <button
                            class="mobile-toggle"
                            type="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">

                            <i class="bi bi-list"></i>

                        </button>


                        <!-- DROPDOWN MENU -->

                        <ul class="dropdown-menu mobile-menu text-center w-100">

                            <li>
                                <a class="dropdown-item font-custom fs-custom fw-semibold text-uppercase text-start py-4 px-4"
                                    href="#home">
                                    Home
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item font-custom fs-custom fw-semibold text-uppercase text-start py-4 px-4"
                                    href="#services">
                                    Women
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item font-custom fs-custom fw-semibold text-uppercase text-start py-4 px-4"
                                    href="#about">
                                    Men
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item font-custom fs-custom fw-semibold text-uppercase text-start py-4 px-4"
                                    href="#contact">
                                    About Us
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item font-custom fs-custom fw-semibold text-uppercase text-start py-4 px-4"
                                    href="#">
                                    Contact
                                </a>
                            </li>

                        </ul>

                    </div>

                </div>


                <!-- ================= COLUMN 3 : OTHER CONTENT ================= -->

                <div class="col-4 d-none d-lg-block">

                    <div class="d-flex justify-content-end align-items-center gap-4">

                        <i class="bi bi-search"></i>

                        <span>$150.00</span>

                        <i class="bi bi-basket"></i>

                        <span>LOG IN</span>

                    </div>

                </div>


            </div>

        </div>

    </header>


    <!-- Bootstrap JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
