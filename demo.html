<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Riccardo Eyewear</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap"
        rel="stylesheet"
    >

    <style>

        /* ================= GENERAL ================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff;
            font-family: "DM Sans", sans-serif;
        }


        /* ================= HEADER ================= */

        header {
            height: auto;
            background: #fff;
        }


        /* ================= NAVBAR ================= */

        .navbar {
            min-height: 180px;
            position: relative;
            background: #fff;
        }

        .navbar > .row {
            align-items: flex-start;
        }


        /* ================= LEFT PART ================= */

        #colum1 > .row {
            margin-left: 40px;

            display: flex;
            align-items: center;

            flex-wrap: wrap;
            gap: 0;
        }


        /* Left links */

        #colum1 .nav-link {
            width: auto;
            flex: 0 0 auto;

            margin-right: 45px;

            padding: 8px 0;

            color: #555;
            text-decoration: none;

            font-size: 20px;
            font-weight: 600;
        }


        /* Home */

        #colum1 .nav-link:first-child {
            color: black;
        }


        /* Contact ko forcefully neeche nahi bhejna */

        #colum1 .nav-link:last-child {
            margin-top: 0;
        }


        /* ================= CENTER LOGO ================= */

        .logo {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .logo img {
            width: 150px;
            height: auto;
            display: block;
        }


        /* ================= RIGHT PART ================= */

        #colum3 > .row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }


        #colum3 .col {
            flex: 0 0 auto;
            width: auto;

            margin-left: 35px;
        }


        /* Search & Basket */

        #colum3 i {
            font-size: 20px;
            color: black;
        }


        /* Price */

        #colum3 strong {
            font-size: 20px;
            color: black;
        }


        /* Login */

        #colum3 a {
            color: black;
            text-decoration: none;
            font-size: 21px;
        }


        /* =================================================
           1280px AND ABOVE

           All 5 menu items in one line
        ================================================= */

        @media (min-width: 1280px) {

            #colum1 > .row {
                flex-wrap: nowrap;
            }

        }


        /* =================================================
           1100px - 1279px

           Contact can move to second line
        ================================================= */

        @media (min-width: 1100px) and (max-width: 1279.98px) {

            #colum1 > .row {
                flex-wrap: wrap;
            }

        }


        /* =================================================
           769px - 1099px

           HOME WOMEN MEN
           ABOUT US CONTACT US
        ================================================= */

        @media (min-width: 769px) and (max-width: 1099.98px) {

            #colum1 > .row {
                flex-wrap: wrap;
            }

            #colum1 .nav-link {
                margin-right: 35px;
            }

        }


        /* =================================================
           768px AND BELOW

           MOBILE HEADER
        ================================================= */

        @media (max-width: 768px) {

            .navbar {
                min-height: 150px;
                background: #fff;
            }

            .navbar > .row {
                min-height: 150px;

                display: flex;

                align-items: center;
                justify-content: center;
            }


            /* Desktop left menu hide */

            #colum1 {
                display: none;
            }


            /* Desktop right side hide */

            #colum3 {
                display: none;
            }


            /* Center logo */

            .logo {
                width: 100%;

                display: flex;
                justify-content: center;
                align-items: center;
            }

            .logo img {
                width: 150px;
            }


            /* Hamburger */

            .logo::after {
                content: "☰";

                display: block;

                position: absolute;

                top: 105px;
                left: 50%;

                transform: translateX(-50%);

                font-size: 18px;
                color: black;
            }

        }


        /* =================================================
           SMALL MOBILE
        ================================================= */

        @media (max-width: 480px) {

            .navbar {
                min-height: 140px;
            }

            .navbar > .row {
                min-height: 140px;
            }

            .logo img {
                width: 140px;
            }

            .logo::after {
                top: 100px;
                font-size: 17px;
            }

        }

    </style>

</head>


<body>

    <header>

        <nav class="navbar">

            <!-- Main Row -->

            <div class="row w-100 align-items-center">


                <!-- ================= LEFT PART ================= -->

                <div id="colum1" class="col-md-5">

                    <div class="row">

                        <a href="#" class="nav-link col">
                            HOME
                        </a>

                        <a href="#" class="nav-link col">
                            WOMEN
                        </a>

                        <a href="#" class="nav-link col">
                            MEN
                        </a>

                        <a href="#" class="nav-link col">
                            ABOUT US
                        </a>

                        <a href="#" class="nav-link col">
                            CONTACT US
                        </a>

                    </div>

                </div>


                <!-- ================= CENTER PART ================= -->

                <div class="col-md-2 logo">

                    <div class="nav-brand">

                        <img
                            src="assets/website_logo.png"
                            alt="Riccardo Eyewear"
                        >

                    </div>

                </div>


                <!-- ================= RIGHT PART ================= -->

                <div id="colum3" class="col-md-5">

                    <div class="row align-items-center">


                        <!-- Search -->

                        <div class="col">

                            <i class="bi bi-search"></i>

                        </div>


                        <!-- Price -->

                        <div class="col">

                            <strong>$150.00</strong>

                        </div>


                        <!-- Basket -->

                        <div class="col">

                            <i class="bi bi-basket"></i>

                        </div>


                        <!-- Login -->

                        <div class="col">

                            <a href="#">
                                LOG IN
                            </a>

                        </div>


                    </div>

                </div>


            </div>

        </nav>

    </header>


</body>

</html>
