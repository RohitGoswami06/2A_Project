<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reusable Product Cards</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Body Font -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Yeseva+One&display=swap"
        rel="stylesheet">


    <link rel="stylesheet" href="product.css">

</head>


<body>


    <!-- =========================================
            PRODUCT SECTION
        ========================================== -->

    <section class="container py-5">

        <div class="row g-4" id="product-container">

            <!-- JavaScript products yahan generate karega -->

        </div>

    </section>



    <!-- =========================================
            SIMPLE CART
        ========================================== -->

    <section class="container pb-5">

        <h4 class="mb-3">
            Cart
        </h4>

        <div id="cart-container">

            <p class="text-muted">
                Cart is empty.
            </p>

        </div>

    </section>



    <!-- =========================================
            PRODUCT DETAILS MODAL
        ========================================== -->

    <div class="modal fade product-modal" id="productModal" tabindex="-1" aria-labelledby="productModalLabel"
        aria-hidden="true">

        <div class="modal-dialog modal-xl modal-dialog-centered">

            <div class="modal-content">


                <!-- CLOSE BUTTON -->

                <button type="button" class="btn-close position-absolute top-0 end-0 m-4 z-3" data-bs-dismiss="modal"
                    aria-label="Close"></button>



                <div class="modal-body">

                    <div class="row g-0">


                        <!-- =================================
                                PRODUCT IMAGE
                            ================================== -->

                        <div class="col-12 col-md-6 d-flex">

                            <div class="modal-product-image w-100">

                                <div id="modalCarousel" class="carousel slide h-100" data-bs-ride="carousel"
                                    data-bs-interval="5000">

                                    <div id="modalCarouselInner" class="carousel-inner h-100">
                                        <!-- JS se images aayengi -->
                                    </div>

                                    <button class="carousel-control-prev" type="button" data-bs-target="#modalCarousel"
                                        data-bs-slide="prev">
                                        <span class="carousel-control-prev-icon"></span>
                                    </button>

                                    <button class="carousel-control-next" type="button" data-bs-target="#modalCarousel"
                                        data-bs-slide="next">
                                        <span class="carousel-control-next-icon"></span>
                                    </button>

                                </div>

                            </div>

                        </div>



                        <!-- =================================
                                PRODUCT DETAILS
                            ================================== -->

                        <div class="col-12 col-md-6 pb-5 ">

                            <div class="modal-product-details ">


                                <!-- TOP CATEGORY -->

                                <div id="modalProductCategoryTop" class="modal-category-top">
                                    WOMEN
                                </div>



                                <!-- PRODUCT NAME -->

                                <h2 id="productModalLabel" class="modal-product-title fw-bolder">
                                    Product Title
                                </h2>



                                <!-- PRICE + SHIPPING -->

                                <div class="modal-price-shipping">

                                    <span id="modalProductPrice" class="modal-price">
                                        $185.00
                                    </span>

                                    <span class="modal-shipping">
                                        &amp; Free Shipping
                                    </span>

                                </div>



                                <!-- DESCRIPTION -->

                                <div id="modalProductDescription" class="modal-description">

                                    <!-- JavaScript description yahan dalega -->

                                </div>



                                <!-- CATEGORY BOTTOM -->

                                <div class="modal-category-bottom">

                                    <strong>
                                        Category:
                                    </strong>

                                    <span id="modalProductCategoryBottom">
                                        Women
                                    </span>

                                </div>


                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>



    <!-- =========================================
            BOOTSTRAP JAVASCRIPT
        ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>



    <!-- =========================================
            JAVASCRIPT
        ========================================== -->

    <script src="product.js"></script>

</body>

</html>
