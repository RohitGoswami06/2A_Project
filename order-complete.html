<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Complete - Riccardo Eyewear</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Links -->
    <link rel="stylesheet" href="order-complete.css">
</head>

<body>

    <!-- TOP LOGO HEADER (Thin top area full width) -->
    <header class="order-complete-header border-bottom py-2 px-4 px-md-5 bg-white">
        <div class="container-fluid p-0">
            <a href="index.html" class="d-inline-block">
                <img src="assets/website_logo.png" alt="Riccardo Eyewear" class="logo-img">
            </a>
        </div>
    </header>

    <!-- MAIN ORDER COMPLETE 50/50 SPLIT CONTAINER -->
    <main class="container-fluid p-0 overflow-hidden">
        <div class="row g-0 min-vh-100">
            
            <!-- LEFT SECTION: 50% Width on Desktop (White Background) -->
            <div class="col-12 col-lg-6 order-left-section bg-white py-4 py-md-5 px-4 px-md-5">
                <div class="left-content-wrapper mx-auto ms-lg-auto me-lg-4" style="max-width: 540px;">
                    
                    <!-- Success Header: Circle Check Icon + Order Number & Thank You -->
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <div class="order-check-circle">
                            <i class="bi bi-check-lg"></i>
                        </div>
                        <div>
                            <div class="order-num-text" id="orderNumberDisplay">Order #1341</div>
                            <div class="order-thank-you-title" id="thankYouDisplay">Thank you, roit!</div>
                        </div>
                    </div>

                    <!-- Order Updates Box -->
                    <div class="order-card-box p-4 mb-4">
                        <h5 class="card-box-heading mb-2">Order Updates</h5>
                        <p class="card-box-subtext mb-0">You will receive order and shipping updates via email.</p>
                    </div>

                    <!-- Customer Information Box (Contact, Address, Payment) -->
                    <div class="order-card-box mb-4">
                        
                        <!-- Contact Row -->
                        <div class="info-row row g-0 align-items-start">
                            <div class="col-3 info-title">Contact</div>
                            <div class="col-9 info-content text-break" id="infoContactEmail">rohitd.bca2024@ssism.org</div>
                        </div>

                        <!-- Address Row -->
                        <div class="info-row row g-0 align-items-start">
                            <div class="col-3 info-title">Address</div>
                            <div class="col-9 info-content" id="infoAddressBlock">
                                <!-- Dynamically populated by order-complete.js -->
                            </div>
                        </div>

                        <!-- Payment Row -->
                        <div class="info-row row g-0 align-items-start">
                            <div class="col-3 info-title">Payment</div>
                            <div class="col-9 info-content" id="infoPaymentMethod">Cash on delivery</div>
                        </div>

                    </div>

                    <!-- Continue Shopping Button -->
                    <div class="mt-4 pt-2">
                        <a href="men.html" class="btn-continue-shopping">
                            Continue Shopping
                        </a>
                    </div>

                </div>
            </div>

            <!-- RIGHT SECTION: 50% Width on Desktop (Light Grey Background) -->
            <div class="col-12 col-lg-6 order-right-section py-4 py-md-5 px-4 px-md-5">
                <div class="right-content-wrapper mx-auto me-lg-auto ms-lg-4" style="max-width: 460px;">
                    
                    <!-- Right Heading: Shopping Bag Icon + Your Order -->
                    <h5 class="your-order-heading mb-4">
                        <i class="bi bi-bag me-2"></i> Your Order
                    </h5>

                    <!-- Product Items List -->
                    <div id="yourOrderItemsList" class="mb-4">
                        <!-- Dynamically populated by order-complete.js -->
                    </div>

                    <!-- Subtotal Row -->
                    <div class="d-flex justify-content-between align-items-center py-3 border-top summary-subtotal-row">
                        <span class="text-muted">Subtotal</span>
                        <span class="text-muted" id="rightSubtotal">$135.00</span>
                    </div>

                    <!-- Total Row -->
                    <div class="d-flex justify-content-between align-items-center py-3 border-top summary-total-row">
                        <span class="total-label">Total</span>
                        <div class="d-flex align-items-center gap-2">
                            <span class="usd-tag">USD</span>
                            <span class="total-amount" id="rightTotal">$135.00</span>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- JavaScript Files -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="order-complete.js"></script>

</body>

</html>
