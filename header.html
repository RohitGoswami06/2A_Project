<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riccardo Eyewear</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Header CSS -->
    <link rel="stylesheet" href="header.css">
</head>


<body>

    <header>

        <div class="container-fluid">

            <div class="row align-items-center">

                <!-- COLUMN 1 : NAVBAR -->
                <div class="col-xl-4 ps-xl-3 col-xxl-5 col-md-4 d-none d-lg-block me-5">
                    <nav class="navbar">
                        <div>
                            <ul class="navbar-nav flex-row flex-wrap" style="padding-left: 20px;">
                                <li class="nav-item me-2 mb-3">
                                    <a class="nav-linkk ps-lg-3 pe-lg-2" href="index.html">Home</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-linkk ps-lg-3 pe-lg-3" href="women.html">Women</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-linkk ps-lg-3 pe-lg-3" href="men.html">Men</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-linkk ps-lg-3 pe-lg-2" href="about.html">About Us</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-linkk px-lg-3 me-lg-4" href="contact.html">Contact</a>
                                </li>
                            </ul>
                        </div>
                    </nav>
                </div>

                <!-- COLUMN 2 : LOGO -->
                <div class="col-lg-2 col-12 text-center ms-5 logo-col" style="margin-right: 55px;">
                    <img src="assets/website_logo.png" alt="Logo" class="header-logo">
                    <div class="dropdown d-lg-none mt-2">
                        <button class="btn btn-outline-secondary p-0" style="width:28px;height:28px" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-list" style="font-size:14px"></i>
                        </button>
                        <ul class="dropdown-menu w-100 text-center">
                            <li><a class="dropdown-item fw-semibold text-uppercase text-start py-4 px-4"
                                    href="index.html">Home</a></li>
                            <li><a class="dropdown-item fw-semibold text-uppercase text-start py-4 px-4"
                                    href="women.html">Women</a></li>
                            <li><a class="dropdown-item fw-semibold text-uppercase text-start py-4 px-4"
                                    href="men.html">Men</a></li>
                            <li><a class="dropdown-item fw-semibold text-uppercase text-start py-4 px-4"
                                    href="about.html">About Us</a></li>
                            <li><a class="dropdown-item fw-semibold text-uppercase text-start py-4 px-4"
                                    href="contact.html">Contact</a></li>
                        </ul>
                    </div>
                </div>

                <!-- COLUMN 3 : ICONS -->
                <div class="col-4 d-none d-lg-block">
                    <div class="d-flex justify-content-end align-items-center ">
                        <i class="bi bi-search ps-5 " style="margin-left: 0px;"></i>
                        <span class="ms-5 ps-3 fw-bold fs-6" id="headerCartTotal">$0.00</span>
                        <div class="position-relative" style="cursor:pointer" onclick="openCartPanel()">
                            <i class="bi bi-basket ms-3" style="font-size:20px"></i>
                            <span
                                class="cart-count bg-dark text-white rounded-circle d-flex align-items-center justify-content-center fw-bold"
                                id="headerCartCount">0</span>
                        </div>
                        <span class="ms-5">LOG IN</span>
                    </div>
                </div>

            </div>

        </div>

    </header>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- CART OVERLAY -->
    <div class="cart-overlay" id="cartOverlay" onclick="closeCartPanel()"></div>

    <!-- CART PANEL -->
    <div class="cart-panel bg-white d-flex flex-column " id="cartPanel">
        <div class="d-flex justify-content-between align-items-center px-4 py-3 border-bottom">
            <h6 class="mb-0 fw-bold text-uppercase">Shopping Cart</h6>
            <button class="btn btn-link text-dark p-0 fs-5 text-decoration-none"
                onclick="closeCartPanel()">&#x2715;</button>
        </div>
        <div class="flex-grow-1 overflow-auto px-4 py-3" id="cartPanelItems"></div>
        <div class="border-top px-4 py-3">
            <div class="d-flex justify-content-between fw-semibold mb-3 pb-3 border-bottom">
                <span>Subtotal:</span>
                <span id="cartPanelSubtotal">$0.00</span>
            </div>
            <button class="btn btn-outline-dark w-100 fw-bold text-uppercase mb-2 cart-btn"
                onclick="window.location.href='cart.html'">VIEW CART</button>
            <button class="btn btn-outline-dark w-100 fw-bold text-uppercase cart-btn"
                onclick="window.location.href='checkout.html'">CHECKOUT</button>
        </div>
    </div>


    <!-- Header JS -->
    <script src="header.js"></script>

</body>

</html>
